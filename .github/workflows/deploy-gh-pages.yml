name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing required secrets: SUPABASE_URL and/or SUPABASE_ANON_KEY" >&2
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Inject Supabase config (Attendance Tracker)
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          supabase_url = os.environ.get('SUPABASE_URL', '').strip()
          anon_key = os.environ.get('SUPABASE_ANON_KEY', '').strip()

          # Support both repo layouts:
          # 1) attendance-hours/... at repo root
          # 2) IEnergy-Portal-main/attendance-hours/... (if the project folder was committed)
          candidates = [
            Path('attendance-hours/config.js'),
            Path('IEnergy-Portal-main/attendance-hours/config.js'),
          ]
          paths = [p for p in candidates if p.exists()]
          if not paths:
            raise SystemExit('Could not find attendance-hours/config.js to inject secrets into.')

          for p in paths:
            s = p.read_text(encoding='utf-8')
            s = s.replace('__SUPABASE_URL__', supabase_url)
            s = s.replace('__SUPABASE_ANON_KEY__', anon_key)
            p.write_text(s, encoding='utf-8')
            print('Injected Supabase config into', p)
          PY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup Node (for the app builds)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Attendance Tracker dependencies
        working-directory: apps/attendance-tracker
        run: npm ci

      # This repository talks to TWO Supabase projects. SUPABASE_URL is the
      # one attendance-hours and the Leave Manager use. The tracker, the
      # Employee Database and the portal sign-in use the other one, which
      # holds the employees and attendance records -- so the tracker must be
      # built against VITE_SUPABASE_URL, not the pair above it.
      #
      # Building it against the wrong project does not fail. It produces an
      # app that loads, finds no session, and bounces every visitor back to
      # the portal, which is exactly what happened the first time.
      - name: Build Attendance Tracker
        working-directory: apps/attendance-tracker
        env:
          # The anon key is a public, publishable key -- it is meant to ship
          # in the browser bundle. Row Level Security is what protects the
          # data. Never put the service_role key here.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Check the tracker was built against the right project
        shell: bash
        run: |
          # A silent mismatch is a site that redirects everybody home, so
          # fail the deploy here instead of shipping it.
          want="${{ secrets.VITE_SUPABASE_URL }}"
          if ! grep -rqF "$want" apps/attendance-tracker/dist/assets; then
            echo "::error::The Attendance Tracker build does not point at VITE_SUPABASE_URL."
            exit 1
          fi
          echo "Tracker bundle points at the expected Supabase project."

      - name: Install Leave Manager dependencies
        working-directory: apps/leave-manager/frontend
        run: npm install

      - name: Build Leave Manager
        working-directory: apps/leave-manager/frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Assemble site folder
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          # Copy portal static files (exclude dev-only folders)
          # What the web server has no business holding.
          #
          # The rsync below used to copy everything but .github, _site
          # and apps, which meant five internal files were fetchable on
          # the live site. docs/cloudflare-setup.md was the worst of
          # them: it lists the origin IP, the nameservers, the SPF
          # record and the DKIM selector -- a map for anyone wanting to
          # reach past a CDN or forge mail from the domain. Beside it,
          # a SQL file publishing the database schema and .cpanel.yml
          # publishing the server paths.
          #
          # Excluded by kind rather than by name so a new .md or .sql
          # does not quietly become public the day somebody adds one.
          # documents.json files are NOT excluded: the HR documents and
          # company policy pages read them at runtime.
          EXCLUDES=(
            --exclude '.github' --exclude '_site' --exclude 'apps'
            --exclude 'docs' --exclude '*.md' --exclude '*.sql'
            --exclude '*.mjs' --exclude '.cpanel.yml' --exclude '*.bundle'
            --exclude '.gitattributes' --exclude '.gitignore'
          )
          rsync -av "${EXCLUDES[@]}" ./ _site/

          # Add Attendance Tracker build output under /attendance-tracker/
          rm -rf _site/attendance-tracker
          mkdir -p _site/attendance-tracker
          rsync -av apps/attendance-tracker/dist/ _site/attendance-tracker/

          # Add Leave Manager build output under /leave-manager/
          rm -rf _site/leave-manager
          mkdir -p _site/leave-manager
          rsync -av apps/leave-manager/frontend/dist/ _site/leave-manager/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
