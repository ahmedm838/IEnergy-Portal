# ---------------------------------------------------------------------
# Deploy the built site to cPanel over FTPS.
#
# The fallback for when cPanel has no Git Version Control. It builds
# exactly what the GitHub Pages workflow builds, then uploads that folder
# instead of publishing it to Pages.
#
# Runs only when started by hand (workflow_dispatch), so it cannot fire
# before the hosting is ready or while Pages is still the live site. To
# make it the real deployment later, add the push trigger back.
#
# Before it will work, three repository secrets are needed. Add them
# under Settings -> Secrets and variables -> Actions. Set them yourself;
# they should not be written down anywhere else:
#
#   CPANEL_FTP_SERVER    the hostname, e.g. ftp.ienergyegypt.com
#   CPANEL_FTP_USERNAME  an FTP account made for this, NOT the cPanel login
#   CPANEL_FTP_PASSWORD  that account's password
#
# Make a dedicated FTP account in cPanel with its directory set to the
# document root. If it ever leaks it can write files and nothing else --
# the cPanel login can delete the account itself.
# ---------------------------------------------------------------------
name: Deploy to cPanel

on:
  # Hand-started only. Decided 21 Oct 2026, and meant to stay that way.
  #
  # Deploying on every push to main meant a merge intended for GitHub
  # Pages also wrote to the live site in the same breath, which left no
  # way to look at a change on a real server before the staff did. The
  # deploy is now a separate, deliberate act: merge to main, look at it
  # on Pages, then run this when it is right.
  #
  # To deploy: Actions -> Deploy to cPanel -> Run workflow, and set
  # dry_run to FALSE. It defaults to true, so a run started without
  # thinking about it writes nothing.
  #
  # The cost of this, which is real: a fix merged to main does not reach
  # the live site until somebody runs this. That has already happened
  # once -- six fixes sat built and unshipped while the live site served
  # the bug they fixed. Merging is not shipping; run this after you
  # merge anything that matters.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be uploaded, write nothing'
        type: boolean
        default: true

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Read here rather than in the purge step, because a step cannot
    # test its own env block in its own `if:`. Absent secrets leave
    # these empty, which is how the purge skips itself.
    env:
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Without this every run downloads both dependency trees from
          # scratch. The two installs were the bulk of a 41 second deploy.
          cache: npm
          cache-dependency-path: |
            apps/attendance-tracker/package-lock.json
            apps/leave-manager/frontend/package.json

      # Both apps build at once. They share nothing but the Node install,
      # and ran one after the other for no reason: 14 seconds then 17.
      # Together they cost what the slower one costs.
      #
      # Each writes its log to a file rather than the step log, because
      # two builds printing at the same time interleave into something
      # nobody can read. The logs are printed afterwards, in order, and
      # a failure prints its own before stopping the run.
      - name: Build both apps
        shell: bash
        env:
          TRACKER_URL: ${{ secrets.VITE_SUPABASE_URL }}
          TRACKER_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          LEAVE_URL: ${{ secrets.SUPABASE_URL }}
          LEAVE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          build_tracker() {
            cd apps/attendance-tracker
            # --prefer-offline uses the cache above instead of the network
            # wherever it can; the other two just stop npm doing work this
            # build has no use for.
            npm ci --prefer-offline --no-audit --no-fund
            VITE_SUPABASE_URL="$TRACKER_URL" VITE_SUPABASE_ANON_KEY="$TRACKER_KEY" npm run build
          }

          build_leave() {
            cd apps/leave-manager/frontend
            # npm install, not ci: this app has no package-lock.json, so
            # there is nothing for ci to install from. That also means its
            # dependency tree is resolved afresh every run and can drift
            # between builds -- worth a lockfile, but that is a change to
            # what gets installed, not just how fast.
            npm install --prefer-offline --no-audit --no-fund
            VITE_SUPABASE_URL="$LEAVE_URL" VITE_SUPABASE_ANON_KEY="$LEAVE_KEY" npm run build
          }

          build_tracker > /tmp/tracker.log 2>&1 &
          tracker_pid=$!
          build_leave > /tmp/leave.log 2>&1 &
          leave_pid=$!

          tracker_rc=0; wait "$tracker_pid" || tracker_rc=$?
          leave_rc=0;   wait "$leave_pid"   || leave_rc=$?

          echo "::group::Attendance Tracker"; cat /tmp/tracker.log; echo "::endgroup::"
          echo "::group::Leave Manager";     cat /tmp/leave.log;   echo "::endgroup::"

          if [ "$tracker_rc" -ne 0 ]; then echo "::error::Attendance Tracker build failed."; exit "$tracker_rc"; fi
          if [ "$leave_rc" -ne 0 ];   then echo "::error::Leave Manager build failed.";     exit "$leave_rc";   fi

      - name: Assemble site folder
        shell: bash
        run: |
          rm -rf _site && mkdir -p _site
          # What the web server has no business holding.
          #
          # The rsync below used to copy everything but .github, _site
          # and apps, which meant five internal files were fetchable on
          # the live site. docs/cloudflare-setup.md was the worst of
          # them: it lists the origin IP, the nameservers, the SPF
          # record and the DKIM selector -- a map for anyone wanting to
          # reach past a CDN or forge mail from the domain. Beside it,
          # a SQL file publishing the database schema and .cpanel.yml
          # publishing the server paths.
          #
          # NOT *.mjs: that is a browser module format, not an internal
          # one. Excluding it took export-workbook.mjs off the server and the
          # Employee Database went blank, because the page imports it.
          #
          # Excluded by kind rather than by name so a new .md or .sql
          # does not quietly become public the day somebody adds one.
          # documents.json files are NOT excluded: the HR documents and
          # company policy pages read them at runtime.
          EXCLUDES=(
            --exclude '.github' --exclude '_site' --exclude 'apps'
            --exclude 'docs' --exclude '*.md' --exclude '*.sql'
            --exclude '.cpanel.yml' --exclude '*.bundle'
            --exclude '.gitattributes' --exclude '.gitignore'
          )
          rsync -av "${EXCLUDES[@]}" ./ _site/
          mkdir -p _site/attendance-tracker _site/leave-manager
          rsync -av apps/attendance-tracker/dist/ _site/attendance-tracker/
          rsync -av apps/leave-manager/frontend/dist/ _site/leave-manager/

      - name: Check the tracker points at the right Supabase project
        shell: bash
        run: |
          # The same guard the Pages workflow carries. Building against
          # the wrong project produces a site that loads and then sends
          # everybody back to the sign-in page.
          if ! grep -rqF "${{ secrets.VITE_SUPABASE_URL }}" _site/attendance-tracker/assets; then
            echo "::error::The Attendance Tracker build does not point at VITE_SUPABASE_URL."
            exit 1
          fi

      - name: Upload to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/

          # The first run should be a dry run: it connects, works out
          # what it would send, and writes nothing. Read that log before
          # letting it write to a live account.
          # A push always deploys for real. Only a hand-started run can be
          # a dry run, and it still defaults to one. Written out rather
          # than left as inputs.dry_run, which a push renders as an empty
          # string and leaves the action to interpret.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

          # WHERE THIS LANDS DEPENDS ON THE FTP ACCOUNT, and getting it
          # wrong is how a deploy ends up in the wrong folder:
          #
          #   A dedicated FTP account whose Directory is set to
          #   portal.ienergyegypt.com starts INSIDE that folder. Its root
          #   is the document root, so this must be ./
          #
          #   The main cPanel account starts at /home/ienergyegypt and
          #   sees everything, so it would need ./portal.ienergyegypt.com/
          #   -- and a typo there can write into public_html, which is the
          #   company website.
          #
          # Set up for the dedicated account, which is the one to use.
          server-dir: ./

          # Only what changed goes up, which keeps a deploy to shared
          # hosting down to seconds rather than minutes.
          state-name: .ftp-deploy-sync-state.json

      # --- Tell Cloudflare the files changed ---------------------------
      #
      # Only does anything once the site is behind Cloudflare and the two
      # secrets exist; until then it skips, so this is safe to merge
      # before any of that is set up.
      #
      # Why it is needed at all. Cloudflare obeys the origin headers, and
      # this site sends HTML as no-cache -- so by default every page
      # navigation still crosses to the origin in Los Angeles for the
      # document, and only the assets come from the edge. Caching HTML at
      # the edge is what removes that trip, and the moment you do that,
      # something has to say when the HTML changed. That is this step.
      #
      # It replaces the no-cache header rather than contradicting it: the
      # header still tells BROWSERS to revalidate, which is what stopped
      # people being served a stale page for ten minutes after a deploy.
      # Only the edge copy is cached, and only until the next deploy.
      #
      # Needs a Cloudflare API token with Zone -> Cache Purge -> Purge,
      # scoped to this zone alone, as CLOUDFLARE_API_TOKEN, and the zone
      # id from the Cloudflare dashboard overview as CLOUDFLARE_ZONE_ID.
      - name: Purge the Cloudflare cache
        if: env.CF_ZONE_ID != '' && env.CF_API_TOKEN != '' && github.event.inputs.dry_run != 'true'
        shell: bash
        run: |
          # -f so a refused purge fails the run. A deploy that uploaded
          # new files and then quietly failed to invalidate the old ones
          # is worse than one that failed outright: the site would serve
          # the previous build from the edge and nothing would say so.
          response=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response"
          # Cloudflare answers 200 with "success": false for some refusals,
          # so the body is checked too, not just the exit code.
          case "$response" in
            *'"success":true'*) echo "Edge cache purged." ;;
            *) echo "::error::Cloudflare refused the purge."; exit 1 ;;
          esac
